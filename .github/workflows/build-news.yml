name: Build news from microCMS

on:
  repository_dispatch:
    types: [microcms]
  workflow_dispatch:

concurrency:
  group: build-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild news pages
        env:
          MICROCMS_SERVICE_ID: ${{ secrets.MICROCMS_SERVICE_ID }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: python3 cms/build-news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "CMS: rebuild news pages"
          # Two publishes in quick succession race each other: the loser's push
          # is rejected as a non-fast-forward and, before this loop, the run
          # simply failed and its rebuild was dropped on the floor -- silently,
          # since nothing reports a red run back to whoever published. The
          # commit only ever touches generated files and the build is
          # deterministic from the source of truth, so rebasing onto whoever
          # won and pushing again is safe.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto origin/main"
            git pull --rebase origin main || exit 1
          done
          echo "push still rejected after 5 attempts"
          exit 1
