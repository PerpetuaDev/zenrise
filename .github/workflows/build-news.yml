name: Build news from microCMS

# The webhook is the fast path, the schedule is the safety net. Between
# 2026-08-11 and 2026-09-16 microCMS sent no dispatch at all: six articles --
# two new, four edited -- sat published in the CMS and absent from the site for
# ten days, and nothing surfaced it, because a webhook that stops firing looks
# exactly like a CMS nobody edited. The schedule means the site converges on
# the CMS within the hour whether or not the webhook works.
#
# GitHub's cron is best-effort and skips under load, so this is a floor on
# staleness, not a guarantee; the webhook is still what makes publishing feel
# instant. Offset from build-tours' :00 so the two jobs do not race to push.
on:
  repository_dispatch:
    types: [microcms]
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

concurrency:
  group: build-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild news pages
        env:
          MICROCMS_SERVICE_ID: ${{ secrets.MICROCMS_SERVICE_ID }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: python3 cms/build-news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "CMS: rebuild news pages"
          # Two publishes in quick succession race each other: the loser's push
          # is rejected as a non-fast-forward and, before this loop, the run
          # simply failed and its rebuild was dropped on the floor -- silently,
          # since nothing reports a red run back to whoever published. The
          # commit only ever touches generated files and the build is
          # deterministic from the source of truth, so rebasing onto whoever
          # won and pushing again is safe.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto origin/main"
            git pull --rebase origin main || exit 1
          done
          echo "push still rejected after 5 attempts"
          exit 1
