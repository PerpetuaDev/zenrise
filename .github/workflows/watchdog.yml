name: Watchdog - site vs microCMS

# The pipelines cannot be trusted to report their own silence. The tours cron
# sat paused from go-live; the microCMS webhook stopped firing on 2026-08-11
# and six articles were missing from zenrise.jp for ten days. Both looked
# healthy from the inside: no red runs, because no runs at all.
#
# So this checks the deployed site against the CMS and opens an issue when
# they disagree. 07:00 JST, so anything found is waiting at the start of the
# working day rather than overnight.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare microCMS against the live site
        id: check
        env:
          MICROCMS_SERVICE_ID: ${{ secrets.MICROCMS_SERVICE_ID }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          set +e
          report=$(python3 cms/watchdog.py 2>&1)
          code=$?
          echo "$report"
          {
            echo 'report<<WATCHDOG_EOF'
            echo "$report"
            echo 'WATCHDOG_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Never fail the job: a red run here is one more thing nobody reads.
          # The issue is the alert.
          exit 0

      - name: Raise or clear the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Site is out of sync with microCMS
          REPORT: ${{ steps.check.outputs.report }}
          CODE: ${{ steps.check.outputs.code }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')

          if [ "$CODE" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Site and microCMS agree again. Closing."
              gh issue close "$existing"
            else
              echo "site matches microCMS"
            fi
            exit 0
          fi

          if [ -n "$existing" ]; then
            echo "drift persists; issue #$existing is already open"
            exit 0
          fi

          {
            echo "The live site does not match what microCMS holds."
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
            echo
            echo "**Most likely cause:** the news build has not run. It runs on a"
            echo "microCMS webhook (instant) and hourly at :30 as a safety net, so if"
            echo "both are quiet, check the webhook in the microCMS panel first --"
            echo "it has silently stopped before, on 2026-08-11."
            echo
            echo "Recover the backlog immediately with:"
            echo
            echo "    gh workflow run \"Build news from microCMS\" -R $GITHUB_REPOSITORY --ref main"
            echo
            echo "This issue closes itself once the site and the CMS agree again."
          } > /tmp/watchdog-issue.md

          gh issue create --title "$TITLE" --body-file /tmp/watchdog-issue.md
